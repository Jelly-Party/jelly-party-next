services:
  server:
    build:
      context: ..
      dockerfile: Dockerfile
      target: server
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${JELLY_PARTY_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
