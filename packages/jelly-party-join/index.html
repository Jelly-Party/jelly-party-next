<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Join a temporary Jelly Party watch party." />
    <title>Join a Jelly Party</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="join-panel">
      <img class="logo" src="/favicon.ico" alt="Jelly Party" width="128" height="128" />
      <p class="brand">Jelly Party</p>
      <h1>You’re invited to watch together</h1>
      <p id="description" class="description">Checking your Jelly Party invite…</p>
      <button id="join" class="join-button" disabled>Open video and join</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <a id="install" class="install hidden" href="/">Install Jelly Party</a>
    </main>
  </body>
</html>
